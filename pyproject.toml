[project]
name = "project"
version = "0.1.0"
description = ""
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]
flake8 = "7.2.0"
mypy = "1.15.0"
black = "25.1.0"
isort = "6.0.1"
pytest = "8.4.1"
pytest-cov = "6.2.1"

[tool.isort]
line_length = 119
profile = "black"
skip_gitignore = true
multi_line_output = 3
include_trailing_comma = true

[tool.black]
line-length = 119
target-version = ['py313']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "dist", "build", "venv"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv/", "/.git/", "build/", "dist/"]
plugins = ["mypy_pandas"]
